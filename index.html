<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ajo — Savings Circle</title>

    <link rel="stylesheet" href="style.css">

    <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    >
</head>

<body>

    <main class="auth-page">

        <!-- Logo / Brand -->
        <header class="brand">
            <div class="brand-icon">
                A
            </div>

            <div>
                <h1>Ajo</h1>
                <p>Savings Circle</p>
            </div>
        </header>


        <!-- Authentication Card -->
        <section class="auth-card">

            <div class="card-heading">
                <span class="eyebrow" id="formEyebrow">
                    WELCOME BACK
                </span>

                <h2 id="formTitle">Welcome back</h2>

                <p id="formDescription">
                    Sign in to continue to your savings circles.
                </p>
            </div>


            <!-- Name: only shown during registration -->
            <div class="input-group hidden" id="nameGroup">

                <label for="name">Full name</label>

                <div class="input-wrapper">
                    <span class="input-icon">👤</span>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        autocomplete="name"
                    >
                </div>

            </div>


            <!-- Email -->
            <div class="input-group">

                <label for="email">Email address</label>

                <div class="input-wrapper">
                    <span class="input-icon">✉</span>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                    >
                </div>

            </div>


            <!-- Password -->
            <div class="input-group">

                <div class="label-row">
                    <label for="password">Password</label>

                    <button
                        type="button"
                        class="forgot-btn"
                        id="forgotPassword"
                    >
                        Forgot password?
                    </button>
                </div>

                <div class="input-wrapper">

                    <span class="input-icon">🔒</span>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        id="passwordToggle"
                        aria-label="Show password"
                    >
                        👁
                    </button>

                </div>

            </div>


            <!-- Message -->
            <div
                class="message hidden"
                id="message"
                role="alert"
            ></div>


            <!-- Main Button -->
            <button
                type="button"
                class="primary-btn"
                id="authBtn"
            >
                Sign in
            </button>


            <!-- Switch login/register -->
            <div class="switch-auth">

                <span id="switchText">
                    Don't have an account?
                </span>

                <button
                    type="button"
                    id="switchBtn"
                >
                    Create account
                </button>

            </div>

        </section>


        <!-- Small privacy note -->
        <p class="security-note">
            🔐 Your account is secured by Firebase Authentication.
        </p>

    </main>


    <script type="module" src="script.js"></script>

</body>
</html>
